<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>مفرّغ الوقّاد</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f1115);
      --card: var(--tg-theme-secondary-bg-color, #181b21);
      --text: var(--tg-theme-text-color, #f4f4f5);
      --hint: var(--tg-theme-hint-color, #9ca3af);
      --button: var(--tg-theme-button-color, #3390ec);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border: color-mix(in srgb, var(--hint) 25%, transparent);
      --ok: #31c48d;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 22px 8px 18px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 9px auto 0;
      max-width: 390px;
      color: var(--hint);
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,.10);
    }

    .file-picker {
      display: block;
      border: 1.5px dashed var(--border);
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: .18s ease;
    }

    .file-picker:active {
      transform: scale(.99);
      opacity: .9;
    }

    .file-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .pick-title {
      font-weight: 750;
      font-size: 17px;
    }

    .pick-hint {
      color: var(--hint);
      font-size: 13px;
      margin-top: 6px;
    }

    #audioFile { display: none; }

    .file-info {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg);
      text-align: right;
    }

    .file-name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .file-size {
      color: var(--hint);
      font-size: 13px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      margin-top: 16px;
      padding: 14px 18px;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: var(--button);
      color: var(--button-text);
      transition: opacity .15s ease, transform .15s ease;
    }

    button:active { transform: scale(.99); }
    button:disabled { opacity: .48; cursor: default; }

    .status-card {
      display: none;
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .status-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      border: 2px solid var(--border);
      border-top-color: var(--button);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      margin: 0;
      white-space: pre-line;
      line-height: 1.7;
      font-size: 14px;
    }

    .progress {
      height: 7px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress > div {
      width: 15%;
      height: 100%;
      background: var(--button);
      border-radius: inherit;
      transition: width .35s ease;
    }

    .engine {
      display: none;
      margin-top: 10px;
      color: var(--hint);
      font-size: 12px;
    }

    .success .spinner { display: none; }
    .success #status { color: var(--ok); }
    .error .spinner { display: none; }
    .error #status { color: var(--danger); }

    .foot {
      text-align: center;
      color: var(--hint);
      font-size: 12px;
      margin-top: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="logo">🎙️</div>
      <h1>مفرّغ الوقّاد</h1>
      <p class="subtitle">ارفع ملفك الصوتي، وسيصل النص المفرّغ إلى محادثة البوت فور اكتماله.</p>
    </section>

    <section class="card">
      <label class="file-picker" for="audioFile">
        <div class="file-icon">📁</div>
        <div class="pick-title">اختر ملفًا صوتيًا</div>
        <div class="pick-hint">اضغط هنا لاختيار الملف من جهازك</div>
      </label>

      <input type="file" id="audioFile" accept="audio/*,video/*,.webm,.m4a,.mp3,.wav,.ogg,.opus,.mp4">

      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>

      <button id="uploadBtn" disabled>ابدأ التفريغ</button>
    </section>

    <section class="status-card" id="statusCard">
      <div class="status-head">
        <div class="spinner"></div>
        <p id="status">جارٍ التحضير…</p>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="engine" id="engine"></div>
    </section>

    <div class="foot">يمكنك إغلاق الصفحة بعد استلام الطلب؛ سيواصل الوقّاد العمل في الخلفية.</div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("bg_color"); } catch (_) {}
      try { tg.setBackgroundColor("bg_color"); } catch (_) {}
    }

    const API = "https://waqqad-transcriber.onrender.com";
    const fileInput = document.getElementById("audioFile");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const statusCard = document.getElementById("statusCard");
    const statusEl = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const engineEl = document.getElementById("engine");

    let pollTimer = null;

    function humanSize(bytes) {
      if (!Number.isFinite(bytes)) return "";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes, i = 0;
      while (value >= 1024 && i < units.length - 1) {
        value /= 1024; i++;
      }
      return `${value.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function showStatus(text, width = 20, kind = "") {
      statusCard.style.display = "block";
      statusCard.classList.remove("success", "error");
      if (kind) statusCard.classList.add(kind);
      statusEl.textContent = text;
      progressBar.style.width = `${width}%`;
    }

    const stageText = {
      queued: ["⏳ تم استلام الطلب، جارٍ بدء المهمة…", 18],
      preparing_audio: ["🎛️ جارٍ تجهيز الصوت وتقسيمه…", 34],
      transcribing_cohere: ["✍️ جارٍ تفريغ الصوت…", 62],
      merging: ["🧩 جارٍ دمج أجزاء النص…", 82],
      sending_to_telegram: ["📨 جارٍ إرسال النتيجة إلى تيليغرام…", 94],
      fallback_to_deepgram: ["🔄 تعذر المحرك الأساسي؛ جارٍ الانتقال إلى المحرك الاحتياطي…", 48],
      uploading_to_deepgram: ["⬆️ جارٍ إرسال الملف إلى المحرك الاحتياطي…", 55],
      waiting_deepgram: ["✍️ المحرك الاحتياطي يعالج الملف الآن…", 70],
      done: ["✅ اكتمل التفريغ وأُرسلت النتيجة.", 100]
    };

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        fileInfo.style.display = "none";
        uploadBtn.disabled = true;
        return;
      }
      fileName.textContent = file.name;
      fileSize.textContent = humanSize(file.size);
      fileInfo.style.display = "block";
      uploadBtn.disabled = false;
      statusCard.style.display = "none";
    });

    async function pollJob(jobId) {
      try {
        const response = await fetch(`${API}/status/${encodeURIComponent(jobId)}`, {
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const job = await response.json();

        if (job.status === "failed") {
          showStatus("❌ تعذر إكمال التفريغ.\n" + (job.error || "حدث خطأ غير متوقع."), 100, "error");
          uploadBtn.disabled = false;
          return;
        }

        if (job.status === "completed" || job.stage === "done") {
          showStatus(
            job.telegram_sent === false
              ? "✅ اكتمل التفريغ، لكن تعذر إرسال الملف إلى تيليغرام."
              : "✅ اكتمل التفريغ وأُرسلت النتيجة إلى محادثة البوت.",
            100,
            "success"
          );
          if (job.engine) {
            engineEl.style.display = "block";
            engineEl.textContent = `المحرك: ${job.engine === "cohere" ? "Cohere Arabic" : "Deepgram (احتياطي)"}`;
          }
          uploadBtn.disabled = false;
          return;
        }

        const [baseText, width] = stageText[job.stage] || ["⚙️ جارٍ معالجة الملف…", 45];
        let text = baseText;

        if (job.stage === "transcribing_cohere" && job.total_parts) {
          text += `\nالجزء ${job.current_part || 1} من ${job.total_parts}`;
        }

        showStatus(text, width);

        if (job.engine) {
          engineEl.style.display = "block";
          engineEl.textContent = job.engine === "cohere"
            ? "المحرك: Cohere Arabic"
            : "المحرك: Deepgram (احتياطي)";
        }

        pollTimer = setTimeout(() => pollJob(jobId), 2000);
      } catch (error) {
        console.error(error);
        showStatus("📡 تعذر تحديث الحالة مؤقتًا؛ سنحاول مجددًا…", 45);
        pollTimer = setTimeout(() => pollJob(jobId), 4000);
      }
    }

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        if (tg?.showAlert) tg.showAlert("اختر ملفًا أولًا");
        else alert("اختر ملفًا أولًا");
        return;
      }

      const userId = tg?.initDataUnsafe?.user?.id;
      if (!userId) {
        showStatus("❌ تعذر التعرف على حساب تيليغرام. افتح الصفحة من داخل البوت.", 100, "error");
        return;
      }

      if (pollTimer) clearTimeout(pollTimer);

      const formData = new FormData();
      formData.append("file", file);
      formData.append("telegram_user_id", userId);

      uploadBtn.disabled = true;
      engineEl.style.display = "none";
      showStatus("⬆️ جارٍ رفع الملف إلى الوقّاد…", 12);

      try {
        const response = await fetch(`${API}/transcribe`, {
          method: "POST",
          body: formData
        });

        const rawText = await response.text();
        let data = null;
        try { data = JSON.parse(rawText); } catch (_) {}

        if (!response.ok) {
          throw new Error(data?.error || `HTTP ${response.status} - ${rawText.slice(0, 200)}`);
        }

        if (!data?.job_id) throw new Error("لم يُرجع الخادم رقم المهمة.");

        showStatus("✅ تم رفع الملف.\nجارٍ بدء التفريغ…", 18);
        pollJob(data.job_id);

      } catch (error) {
        console.error(error);
        showStatus("❌ حدث خطأ:\n" + error.message, 100, "error");
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
